<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phosphor — forms</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../dist/phosphor.css">
</head>
<body>
  <div class="container py-5" style="max-width: 40rem;">
    <nav class="mb-4 d-flex flex-wrap gap-2 align-items-center">
      <a href="index.html" class="btn btn-sm btn-outline-secondary">index</a>
      <a href="buttons.html" class="btn btn-sm btn-outline-secondary">buttons</a>
      <a href="forms.html" class="btn btn-sm btn-outline-primary">forms</a>
      <a href="alerts.html" class="btn btn-sm btn-outline-secondary">alerts</a>
      <a href="cards.html" class="btn btn-sm btn-outline-secondary">cards</a>
      <a href="panels.html" class="btn btn-sm btn-outline-secondary">panels</a>
      <a href="modals.html" class="btn btn-sm btn-outline-secondary">modals</a>
      <a href="toasts.html" class="btn btn-sm btn-outline-secondary">toasts</a>
      <a href="tables.html" class="btn btn-sm btn-outline-secondary">tables</a>
      <a href="badges.html" class="btn btn-sm btn-outline-secondary">badges</a>
      <a href="navs.html" class="btn btn-sm btn-outline-secondary">navs</a>
      <a href="calendar.html" class="btn btn-sm btn-outline-secondary">calendar</a>
      <button class="btn btn-sm btn-secondary ms-auto"
        onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">
        Toggle theme
      </button>
    </nav>

    <h1 class="mb-1">Forms</h1>
    <p class="text-muted mb-4">
      Bootstrap form markup, unchanged. Phosphor adds the amber focus glow,
      raised surfaces, and placeholder ink.
    </p>

    <div class="mb-3">
      <label for="text" class="form-label">Text field</label>
      <input type="text" class="form-control" id="text" placeholder="ph-terminal">
    </div>

    <div class="mb-3">
      <label for="textarea" class="form-label">Textarea</label>
      <textarea class="form-control" id="textarea" rows="3" placeholder="Enter log output…"></textarea>
    </div>

    <div class="mb-3">
      <label for="select" class="form-label">Select</label>
      <select class="form-select" id="select">
        <option selected>Amber</option>
        <option>Phosphor green</option>
        <option>CRT red</option>
      </select>
    </div>

    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="check1" checked>
      <label class="form-check-label" for="check1">Checkbox (checked)</label>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="check2">
      <label class="form-check-label" for="check2">Checkbox</label>
    </div>

    <div class="form-check mb-2">
      <input class="form-check-input" type="radio" name="radio" id="radio1" checked>
      <label class="form-check-label" for="radio1">Radio one</label>
    </div>
    <div class="form-check mb-4">
      <input class="form-check-input" type="radio" name="radio" id="radio2">
      <label class="form-check-label" for="radio2">Radio two</label>
    </div>

    <div class="row g-2">
      <div class="col">
        <input type="text" class="form-control is-valid" value="Valid input">
      </div>
      <div class="col">
        <input type="text" class="form-control is-invalid" value="Invalid input">
      </div>
    </div>
  </div>
</body>
</html>
