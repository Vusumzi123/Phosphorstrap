<!doctype html>
<html lang="en" data-theme="green-crt">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../dist/phosphorstrap.css">
  <link rel="stylesheet" href="../themes/green-crt.css">
</head>
<body>
  <button class="btn btn-primary" id="b">Primary</button>
  <pre id="out">pending</pre>
  <script>
    const b = document.getElementById("b");
    const cs = getComputedStyle(b);
    document.getElementById("out").textContent = [
      "theme=" + document.documentElement.dataset.theme,
      "btn bg-color=" + cs.backgroundColor,
      "--ph-primary=" + cs.getPropertyValue("--ph-primary").trim(),
      "--ph-accent=" + cs.getPropertyValue("--ph-accent").trim(),
      "--bs-btn-bg=" + cs.getPropertyValue("--bs-btn-bg").trim(),
      "body bg=" + getComputedStyle(document.body).backgroundColor
    ].join("\n");
  </script>
</body>
</html>
