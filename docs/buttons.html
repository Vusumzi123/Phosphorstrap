<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phosphor — buttons</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../dist/phosphor.css">
</head>
<body>
  <div class="container py-5" style="max-width: 48rem;">
    <nav class="mb-4 d-flex flex-wrap gap-2 align-items-center">
      <a href="index.html" class="btn btn-sm btn-outline-secondary">index</a>
      <a href="buttons.html" class="btn btn-sm btn-outline-primary">buttons</a>
      <a href="forms.html" class="btn btn-sm btn-outline-secondary">forms</a>
      <a href="alerts.html" class="btn btn-sm btn-outline-secondary">alerts</a>
      <a href="cards.html" class="btn btn-sm btn-outline-secondary">cards</a>
      <a href="panels.html" class="btn btn-sm btn-outline-secondary">panels</a>
      <a href="modals.html" class="btn btn-sm btn-outline-secondary">modals</a>
      <a href="toasts.html" class="btn btn-sm btn-outline-secondary">toasts</a>
      <a href="tables.html" class="btn btn-sm btn-outline-secondary">tables</a>
      <a href="badges.html" class="btn btn-sm btn-outline-secondary">badges</a>
      <a href="navs.html" class="btn btn-sm btn-outline-secondary">navs</a>
      <a href="calendar.html" class="btn btn-sm btn-outline-secondary">calendar</a>
      <button class="btn btn-sm btn-secondary ms-auto"
        onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'">
        Toggle theme
      </button>
    </nav>

    <h1 class="mb-1">Buttons</h1>
    <p class="text-muted mb-4">
      Bootstrap <code>.btn</code> markup, unchanged. Phosphor adds the
      gradient wash, focus glow, and terminal letter-spacing.
    </p>

    <h2 class="h5 mt-4 mb-2">Solid</h2>
    <p>
      <button class="btn btn-primary me-2">Primary</button>
      <button class="btn btn-secondary me-2">Secondary</button>
      <button class="btn btn-success me-2">Success</button>
      <button class="btn btn-danger me-2">Danger</button>
      <button class="btn btn-warning me-2">Warning</button>
      <button class="btn btn-info me-2">Info</button>
      <button class="btn btn-light me-2">Light</button>
      <button class="btn btn-dark">Dark</button>
    </p>

    <h2 class="h5 mt-4 mb-2">Outline</h2>
    <p>
      <button class="btn btn-outline-primary me-2">Primary</button>
      <button class="btn btn-outline-secondary me-2">Secondary</button>
      <button class="btn btn-outline-success me-2">Success</button>
      <button class="btn btn-outline-danger me-2">Danger</button>
      <button class="btn btn-outline-warning me-2">Warning</button>
      <button class="btn btn-outline-info">Info</button>
    </p>

    <h2 class="h5 mt-4 mb-2">Sizes &amp; states</h2>
    <p>
      <button class="btn btn-primary btn-sm me-2">Small</button>
      <button class="btn btn-primary me-2">Regular</button>
      <button class="btn btn-primary btn-lg me-2">Large</button>
      <button class="btn btn-primary me-2" disabled>Disabled</button>
      <button class="btn btn-outline-primary" disabled>Disabled</button>
    </p>
    <p class="text-muted small">Tab through the buttons to see the focus glow.</p>
  </div>
</body>
</html>
