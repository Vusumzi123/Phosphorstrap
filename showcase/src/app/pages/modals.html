<h1 class="mb-1">Modals</h1>
<p class="text-muted mb-4">
  Bootstrap <code>.modal</code> markup and JS, unchanged. The bridge
  themes <code>--bs-modal-*</code>; Phosphor adds the gradient title
  bar (same wash as panels) and terminal type.
</p>

<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#demoModal">
  Launch modal
</button>

<div class="modal fade" id="demoModal" tabindex="-1" aria-labelledby="demoModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="demoModalLabel">Confirm action</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Purge orphaned cache entries? This cannot be undone.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Purge</button>
      </div>
    </div>
  </div>
</div>
