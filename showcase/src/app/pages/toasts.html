<h1 class="mb-1">Toasts</h1>
<p class="text-muted mb-4">
  Bootstrap <code>.toast</code> markup and JS, unchanged. The bridge
  themes <code>--bs-toast-*</code>; the amber left edge is the status
  accent — add <code>.toast--success|danger|warning|info</code> to
  recolor it.
</p>

<button class="btn btn-primary mb-3" (click)="showToast(demoToast)">
  Show toast
</button>

<div class="toast-container position-fixed top-0 end-0 p-3">
  <div #demoToast class="toast toast--success" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <strong class="me-auto">phosphorstrap</strong>
      <small>now</small>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      Build completed with exit code 0.
    </div>
  </div>
</div>
